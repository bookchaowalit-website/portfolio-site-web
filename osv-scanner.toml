[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-01
reason = "glob 13 abort-signal bypass; build-time only via serwist, which never aborts a walk. Fixed only in glob 14, outside serwist's range. Added 2026-11-02."

