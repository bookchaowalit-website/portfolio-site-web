# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# CI never deploys: Vercel deploys main through its Git integration, and
# deploy-smoke.yml checks the production deployment afterwards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  a11y-e2e:
    name: A11y / keyboard e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          # Build must not require live secrets; contact/newsletter fail closed at runtime.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: |
          npm run start -- -p 3000 &
          echo $! > /tmp/portfolio-server.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/en" >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to become ready"
          exit 1

      - name: Keyboard / a11y Playwright suite
        run: npm run e2e:a11y && npm run test:a11y
        env:
          BASE_URL: http://127.0.0.1:3000
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-a11y
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/portfolio-server.pid ]; then
            kill "$(cat /tmp/portfolio-server.pid)" 2>/dev/null || true
          fi

  lighthouse:
    name: Lighthouse (a11y gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for Lighthouse Chrome)
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: |
          npm run start -- -p 3000 &
          echo $! > /tmp/portfolio-lh-server.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/en" >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to become ready"
          exit 1

      - name: Lighthouse CI (accessibility error gate)
        run: |
          # Point Lighthouse at Playwright Chromium when system Chrome is absent.
          CHROME_BIN="$(node -e "const {chromium}=require('playwright'); console.log(chromium.executablePath())")"
          echo "Using Chrome: $CHROME_BIN"
          export CHROME_PATH="$CHROME_BIN"
          npm run lhci:ci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-ci-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/portfolio-lh-server.pid ]; then
            kill "$(cat /tmp/portfolio-lh-server.pid)" 2>/dev/null || true
          fi

  autopilot-pr-status:
    # Autopilot runs this workflow on its own PR branches with workflow_dispatch (a PR opened with
    # GITHUB_TOKEN starts no workflow). Such a run is not attached to the PR, so report the overall
    # result as a commit status on the head commit, which the PR's checks list does show.
    name: CI (autopilot PR)
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [web, security, a11y-e2e, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the result on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          state=success
          for r in $RESULTS; do [ "$r" = success ] || state=failure; done
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context="CI (autopilot PR)" \
            -f target_url="$RUN_URL" -f description="ci.yml (workflow_dispatch): $state"
